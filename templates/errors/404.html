<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 Not Found — ResolveAI</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
</head>
<body style="background:var(--bg);display:flex;align-items:center;justify-content:center;min-height:100vh;">
<div style="text-align:center;max-width:420px;padding:32px;">
  <div style="width:72px;height:72px;background:var(--accent-light);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 24px;">
    <i data-lucide="search-x" style="width:36px;height:36px;color:var(--accent);"></i>
  </div>
  <h1 style="font-size:2rem;font-weight:700;color:var(--text-primary);margin-bottom:8px;">404</h1>
  <h2 style="font-size:1.1rem;font-weight:600;margin-bottom:12px;">Page Not Found</h2>
  <p style="color:var(--text-secondary);margin-bottom:28px;">The page you're looking for doesn't exist or has been moved.</p>
  <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;">
    <a href="javascript:history.back()" class="btn btn-secondary">Go Back</a>
    <a href="/" class="btn btn-primary">Home</a>
  </div>
</div>
<script>lucide.createIcons();</script>
</body>
</html>
